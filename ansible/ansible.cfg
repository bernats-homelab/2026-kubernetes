# Em /mnt/c o WSL marca o diretório como world-writable e o Ansible ignora este
# arquivo quando lido do cwd; o Makefile exporta ANSIBLE_CONFIG apontando para cá.
[defaults]
inventory = inventory/local.yaml
roles_path = roles
host_key_checking = True
interpreter_python = /usr/bin/python3
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = False

[ssh_connection]
pipelining = True
