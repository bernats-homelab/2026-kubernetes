# O NAS é configurado pelo openmediavault (dono da configuração). Este role só
# VERIFICA os exports a partir do notebook e cria os PVs que apontam para eles.
- name: Verificar se o cliente NFS (nfs-common) já está instalado
  ansible.builtin.stat:
    path: /usr/sbin/showmount
  register: nas_storage_nfs_client

# No primeiro `make plan` o role base ainda não instalou o nfs-common (check mode
# não instala nada); a verificação dos exports fica para o apply.
- name: Exigir o cliente NFS fora do check mode
  ansible.builtin.assert:
    that: nas_storage_nfs_client.stat.exists or ansible_check_mode
    fail_msg: "showmount não encontrado: o role base deveria ter instalado o nfs-common."
    quiet: true

- name: Avisar que a verificação dos exports fica para o apply
  ansible.builtin.debug:
    msg: "nfs-common ainda não instalado: o role base o instala no apply, que então verifica os exports."
  when: not nas_storage_nfs_client.stat.exists

- name: Listar exports NFS do NAS
  ansible.builtin.command: showmount --no-headers -e {{ nas_storage_host }}
  register: nas_storage_showmount
  changed_when: false
  failed_when: false
  check_mode: false
  when: nas_storage_nfs_client.stat.exists

- name: Garantir que os exports dos apps existem no NAS
  vars:
    nas_storage_exported: "{{ nas_storage_showmount.stdout_lines | map('split') | map('first') | list }}"
    nas_storage_wanted: "{{ nas_storage_volumes | map(attribute='export') | map('extract', nas_storage_exports) | list }}"
  ansible.builtin.assert:
    that:
      - nas_storage_showmount.rc == 0
      - nas_storage_wanted | difference(nas_storage_exported) | length == 0
    fail_msg: >-
      Exports NFS ausentes em {{ nas_storage_host }}
      (encontrados: {{ nas_storage_exported | default([]) }};
      erro: {{ nas_storage_showmount.stderr | default('', true) or nas_storage_showmount.msg | default('') }}).
      Crie-os na UI do OpenMediaVault conforme o README (seção "NAS: exports NFS no OMV").
  when: nas_storage_nfs_client.stat.exists

# Montagem temporária com as mesmas opções dos PVs: pega squash/permissão errados
# antes de virarem um pod do Immich em CrashLoopBackOff.
- name: Testar montagem dos exports (temporária)
  ansible.builtin.shell: |
    set -euo pipefail
    dir="$(mktemp -d)"
    # Na primeira montagem NFS do host o rpc-statd ainda está subindo e o umount
    # pode falhar uma vez; tenta de novo antes de remover o diretório.
    trap 'umount "${dir}" 2>/dev/null || { sleep 2; umount "${dir}"; }; rmdir "${dir}"' EXIT
    mount -t nfs -o "{{ (nas_storage_mount_options + [item.read_only | ternary('ro', 'rw')]) | join(',') }}" \
      "{{ nas_storage_host }}:{{ nas_storage_exports[item.export] }}" "${dir}"
    ls "${dir}" >/dev/null
    {% if item.write_test and not ansible_check_mode %}
    probe="${dir}/.k3s-write-test-$$"
    touch "${probe}" && rm "${probe}"
    {% endif %}
  args:
    executable: /bin/bash
  loop: "{{ nas_storage_volumes }}"
  loop_control:
    label: "{{ item.name }}: {{ nas_storage_exports[item.export] }}"
  changed_when: false
  check_mode: false
  when: nas_storage_nfs_client.stat.exists

- name: PVs dos apps
  when: not ansible_check_mode or k3s_installed_version | default('') | length > 0
  environment:
    K8S_AUTH_KUBECONFIG: "{{ nas_storage_kubeconfig }}"
  block:
    - name: Criar PVs NFS pré-vinculados às PVCs dos apps
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: "{{ item.name }}"
            labels:
              app.kubernetes.io/part-of: "{{ item.namespace }}"
          spec:
            capacity:
              storage: "{{ item.capacity }}"
            accessModes: ["{{ item.access_mode }}"]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            mountOptions: "{{ nas_storage_mount_options }}"
            nfs:
              server: "{{ nas_storage_host }}"
              path: "{{ nas_storage_exports[item.export] }}"
              readOnly: "{{ item.read_only }}"
            # Só a PVC de mesmo nome, no namespace do app, pode usar este PV.
            claimRef:
              namespace: "{{ item.namespace }}"
              name: "{{ item.name }}"
      loop: "{{ nas_storage_volumes }}"
      loop_control:
        label: "{{ item.name }}"
