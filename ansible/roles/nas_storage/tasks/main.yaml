# O NAS é configurado pelo openmediavault (dono da configuração). Este role só
# VERIFICA os exports a partir do notebook e cria os PVs que apontam para eles.
- name: Listar exports NFS do NAS
  ansible.builtin.command: showmount --no-headers -e {{ nas_storage_host }}
  register: nas_storage_showmount
  changed_when: false
  failed_when: false
  check_mode: false

- name: Garantir que os exports do Immich existem no NAS
  vars:
    nas_storage_exported: "{{ nas_storage_showmount.stdout_lines | map('split') | map('first') | list }}"
  ansible.builtin.assert:
    that:
      - nas_storage_showmount.rc == 0
      - nas_storage_exports.photos in nas_storage_exported
      - nas_storage_exports.data in nas_storage_exported
    fail_msg: >-
      Exports NFS ausentes em {{ nas_storage_host }}
      (encontrados: {{ nas_storage_exported | default([]) }}; erro: {{ nas_storage_showmount.stderr | default('') }}).
      Crie-os na UI do OpenMediaVault conforme o README (seção "NAS: exports NFS no OMV").

# Montagem temporária com as mesmas opções dos PVs: pega squash/permissão errados
# antes de virarem um pod do Immich em CrashLoopBackOff.
- name: Testar montagem dos exports (temporária)
  ansible.builtin.shell: |
    set -euo pipefail
    dir="$(mktemp -d)"
    trap 'umount "${dir}" 2>/dev/null || true; rmdir "${dir}"' EXIT
    mount -t nfs -o "{{ (nas_storage_mount_options + [item.mode]) | join(',') }}" \
      "{{ nas_storage_host }}:{{ item.path }}" "${dir}"
    ls "${dir}" >/dev/null
    {% if item.write and not ansible_check_mode %}
    probe="${dir}/.k3s-write-test-$$"
    touch "${probe}" && rm "${probe}"
    {% endif %}
  args:
    executable: /bin/bash
  loop:
    - { name: photos, path: "{{ nas_storage_exports.photos }}", mode: ro, write: false }
    - { name: data, path: "{{ nas_storage_exports.data }}", mode: rw, write: true }
  loop_control:
    label: "{{ item.name }}: {{ item.path }}"
  changed_when: false
  check_mode: false

- name: PVs do Immich
  when: not ansible_check_mode or k3s_installed_version | default('') | length > 0
  environment:
    K8S_AUTH_KUBECONFIG: "{{ nas_storage_kubeconfig }}"
  block:
    - name: Criar PVs NFS pré-vinculados às PVCs do Immich
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: "immich-{{ item.name }}"
            labels:
              app.kubernetes.io/part-of: immich
          spec:
            capacity:
              storage: "{{ nas_storage_capacity[item.name] | default('100Gi') }}"
            accessModes: ["{{ item.access_mode }}"]
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ""
            mountOptions: "{{ nas_storage_mount_options }}"
            nfs:
              server: "{{ nas_storage_host }}"
              path: "{{ item.path }}"
              readOnly: "{{ item.read_only }}"
            # Só a PVC do Immich pode usar este PV.
            claimRef:
              namespace: "{{ nas_storage_namespace }}"
              name: "immich-{{ item.name }}"
      loop:
        - { name: photos, path: "{{ nas_storage_exports.photos }}", access_mode: ReadOnlyMany, read_only: true }
        - { name: data, path: "{{ nas_storage_exports.data }}", access_mode: ReadWriteOnce, read_only: false }
      loop_control:
        label: "immich-{{ item.name }}"
