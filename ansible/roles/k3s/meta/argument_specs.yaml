argument_specs:
  main:
    short_description: Instala e configura k3s single-node
    options:
      k3s_version:
        type: str
        required: true
      k3s_install_script_sha256:
        type: str
        required: true
      tailscale_enabled:
        type: bool
        required: true
      ghcr_pull_username:
        description: Usuário do GitHub dono do PAT de pull do GHCR
        type: str
        default: ""
      ghcr_pull_token:
        description: PAT classic só com read:packages (vazio = sem registries.yaml, como no CI)
        type: str
        default: ""
        no_log: true
