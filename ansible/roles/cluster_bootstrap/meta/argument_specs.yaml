argument_specs:
  main:
    short_description: Segredos iniciais, ArgoCD e Application raiz
    options:
      git_repo_url:
        type: str
        required: true
      git_revision:
        type: str
        required: true
      tailscale_enabled:
        type: bool
        required: true
      nas_storage_enabled:
        type: bool
        required: true
      external_apps_smoke_enabled:
        type: bool
        required: true
      apps_values:
        type: dict
        required: true
      tailscale_oauth_client_id:
        type: str
        required: true
        no_log: true
      tailscale_oauth_client_secret:
        type: str
        required: true
        no_log: true
      sops_age_cluster_key:
        description: Chave privada age (AGE-SECRET-KEY-1...) que o KSOPS usa no repo-server do ArgoCD
        type: str
        required: true
        no_log: true
      argocd_github_app_id:
        description: ID da GitHub App com que o ArgoCD lê os repos privados da org (vazio = sem credencial, como no CI)
        type: str
        default: ""
      argocd_github_app_installation_id:
        description: ID da instalação da GitHub App na org bernats-homelab
        type: str
        default: ""
      argocd_github_app_private_key:
        description: Chave privada (PEM) da GitHub App
        type: str
        default: ""
        no_log: true
