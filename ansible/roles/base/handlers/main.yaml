- name: Recarregar sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

# Substituir (-r) o perfil já carregado também atualiza os containers em execução.
- name: Recarregar perfil AppArmor dos containers
  ansible.builtin.command: apparmor_parser --replace /etc/apparmor.d/cri-containerd.apparmor.d
  changed_when: true
