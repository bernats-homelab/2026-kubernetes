# Copie para ansible/inventory/local.yaml (ignorado pelo git) e preencha.
# Use o nome curto do MagicDNS, não o FQDN *.ts.net.
all:
  children:
    k3s_server:
      hosts:
        notebook:
          ansible_host: <hostname-magicdns>
          ansible_user: <usuario>
          # NAS (openmediavault) com os exports NFS do Immich; veja o README.
          # Ficam no host, não em `vars:` do grupo: variáveis de grupo do inventário
          # perdem para ansible/group_vars/all (onde o padrão é false).
          nas_storage_enabled: true
          nas_storage_host: <hostname-magicdns-do-nas>
          nas_storage_exports:
            photos: </export/fotos>
            data: </export/immich-data>
            obsidian: </export/borbsidian>
            home_assistant: </export/home-assistant>
          # OpenTelemetry Collector no host (journald + métricas) -> gateway do cluster.
          otel_host_agent_enabled: true
          otel_host_agent_endpoint: <nome-magicdns-do-gateway>:4317
    # NAS: o Ansible só gerencia o Syncthing dele (ADR 011); o resto é pela UI do OMV.
    nas:
      hosts:
        nas:
          ansible_host: <hostname-magicdns-do-nas>
          ansible_user: root
          nas_syncthing_enabled: true
          # Estado (config, chaves, índice) no disco de dados, fora do pendrive.
          nas_syncthing_home: </srv/dev-disk-by-uuid-.../appdata/syncthing>
          # Lista completa: devices fora dela são removidos.
          nas_syncthing_devices:
            - id: <DEVICE-ID-DO-CELULAR>
              name: <nome>
          nas_syncthing_folders:
            - id: <id-da-pasta>
              label: <rótulo>
              path: </srv/dev-disk-by-uuid-.../caminho/do/vault>
              devices: [<DEVICE-ID-DO-CELULAR>]
