# Modelo (texto claro, sem valores reais). Para criar o arquivo real:
#   cp ansible/secrets/secrets.example.yaml ansible/secrets/secrets.sops.yaml
#   sops --encrypt --in-place ansible/secrets/secrets.sops.yaml
#   sops ansible/secrets/secrets.sops.yaml   # edita já criptografado
tailscale_oauth_client_id: REPLACE_ME
tailscale_oauth_client_secret: REPLACE_ME
# Chave age do cluster (KSOPS): `age-keygen | grep AGE-SECRET-KEY`; a pública vai no .sops.yaml.
sops_age_cluster_key: REPLACE_ME
# Opcionais (apps externas privadas; veja o README). Vazio = sem credencial.
# GitHub App da org (Contents: read-only) com que o ArgoCD lê os repos privados.
argocd_github_app_id: ""
argocd_github_app_installation_id: ""
argocd_github_app_private_key: ""
# PAT classic só com read:packages: o k3s puxa imagens privadas do ghcr.io.
ghcr_pull_username: ""
ghcr_pull_token: ""
