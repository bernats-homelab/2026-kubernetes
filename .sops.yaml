# Chaves PÚBLICAS age. A primeira regra que casar com o caminho vence.
#   wsl     age1fskv...  privada só no WSL (~/.config/sops/age/keys.txt, backup no gerenciador de senhas)
#   cluster age1kn09...  privada no Secret argocd/sops-age (criado pelo Ansible a partir de ansible/secrets)
#   ci      age13jef...  privada PÚBLICA em tests/ci-age.key; só para o demo do hello-world (e2e)
# Ao mudar destinatários: `sops updatekeys <arquivo>` em cada *.sops.yaml afetado.
creation_rules:
  # Segredos do bootstrap (Ansible): só o WSL descriptografa.
  - path_regex: (^|/)ansible/secrets/[^/]+\.sops\.yaml$
    age: age1fskvnv59jkjddglqvsllm3d54qtd6xl0u00utexhd0t0vddlfp8qe2plxs

  # Demo do KSOPS, exercitado no e2e: conteúdo sem valor, legível pelo CI.
  - path_regex: (^|/)kubernetes/workloads/hello-world/.+\.sops\.yaml$
    unencrypted_regex: ^(apiVersion|metadata|kind|type)$
    age: >-
      age1fskvnv59jkjddglqvsllm3d54qtd6xl0u00utexhd0t0vddlfp8qe2plxs,
      age1kn09fr57m2vz4jhpw6e8k9qswm0sl702h6kecry5rn0kpjyyuf4sf33yde,
      age13jefle8t0y6t6a2epfjm3tpdczy79qlljxjhme6xttwfkw9309zq5m7v6m

  # Secrets dos apps (KSOPS no ArgoCD): WSL para editar, cluster para sincronizar.
  - path_regex: (^|/)kubernetes/.+\.sops\.yaml$
    unencrypted_regex: ^(apiVersion|metadata|kind|type)$
    age: >-
      age1fskvnv59jkjddglqvsllm3d54qtd6xl0u00utexhd0t0vddlfp8qe2plxs,
      age1kn09fr57m2vz4jhpw6e8k9qswm0sl702h6kecry5rn0kpjyyuf4sf33yde
