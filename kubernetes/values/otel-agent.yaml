# Values do chart opentelemetry-collector (release otel-agent), versão em
# kubernetes/apps/values.yaml. DaemonSet: logs dos pods, métricas do kubelet, OTLP
# dos apps e scrape dos /metrics que já existem; tudo enriquecido com metadados do
# k8s e enviado por OTLP ao otel-gateway. Veja docs/adr/008.
mode: daemonset
fullnameOverride: otel-agent

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: 0.163.2
  digest: sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849

presets:
  logsCollection:
    enabled: true
  kubernetesAttributes:
    enabled: true
  kubeletMetrics:
    enabled: true

# filelog lê /var/log/pods (root:root 0640 no host).
securityContext:
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
    add: [DAC_READ_SEARCH]

# Apps falam OTLP com o Service otel-agent; nada de hostPort no notebook.
ports:
  otlp:
    hostPort: 0
  otlp-http:
    hostPort: 0
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

service:
  enabled: true

config:
  receivers:
    jaeger: null
    zipkin: null
    kubeletstats:
      collection_interval: 30s
    prometheus:
      config:
        scrape_configs:
          # Substitui o scrape do próprio coletor (default do chart).
          # Nomes dos jobs iguais aos do dashboard oficial do ArgoCD.
          - job_name: argocd-application-controller-metrics
            scrape_interval: 60s
            static_configs:
              - targets: [argocd-application-controller-metrics.argocd.svc:8082]
          - job_name: argocd-server-metrics
            scrape_interval: 60s
            static_configs:
              - targets: [argocd-server-metrics.argocd.svc:8083]
          - job_name: argocd-repo-server-metrics
            scrape_interval: 60s
            static_configs:
              - targets: [argocd-repo-server-metrics.argocd.svc:8084]
          # Backends e DNS: só as séries que os dashboards e alertas usam (allowlist).
          - job_name: loki
            scrape_interval: 60s
            static_configs:
              - targets: [loki.observability.svc:3100]
                labels: {cluster: homelab}
            metric_relabel_configs:
              - source_labels: [__name__]
                # yamllint disable-line rule:line-length
                regex: (loki_(request_duration_seconds_.*|panic_total|discarded_samples_total|build_info|boltdb_shipper_.*|compactor_.*|ingester_.*|distributor_.*)|process_.*|go_goroutines|go_memstats_.*)
                action: keep
          - job_name: tempo
            scrape_interval: 60s
            static_configs:
              - targets: [tempo.observability.svc:3200]
                labels: {cluster: homelab}
            metric_relabel_configs:
              - source_labels: [__name__]
                # yamllint disable-line rule:line-length
                regex: (tempo_(distributor_.*|metrics_generator_.*|request_duration_seconds_.*|build_info|ingester_.*)|tempodb_(compaction|blocklist|retention)_.*|prometheus_remote_storage_.*|process_.*|go_goroutines|go_memstats_.*)
                action: keep
          - job_name: prometheus
            scrape_interval: 60s
            static_configs:
              - targets: [prometheus-server.observability.svc:80]
                labels: {cluster: homelab}
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: (prometheus_.*|net_conntrack_.*|http_request_duration_.*|process_.*|go_goroutines|go_memstats_.*)
                action: keep
          - job_name: coredns
            scrape_interval: 60s
            static_configs:
              - targets: [kube-dns.kube-system.svc:9153]
                labels: {cluster: homelab}
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: (coredns_(dns_.*|forward_.*|cache_.*|panics_total|health_.*|build_info)|process_.*|go_goroutines)
                action: keep
          # Postgres do CloudNativePG (cnpg_backends_total, max_connections...).
          - job_name: cnpg
            scrape_interval: 60s
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_cnpg_io_podRole]
                regex: instance
                action: keep
              - source_labels: [__meta_kubernetes_pod_container_port_name]
                regex: metrics
                action: keep
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
          # Immich (IMMICH_TELEMETRY_INCLUDE=all): API em :8081 e workers em :8082.
          # "$$" é o "$" literal (o coletor expande ${...} na config).
          - job_name: immich
            scrape_interval: 60s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [immich]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                regex: server
                action: keep
              - source_labels: [__meta_kubernetes_pod_ip]
                regex: (.+)
                replacement: $${1}:8081
                target_label: __address__
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
          - job_name: immich-workers
            scrape_interval: 60s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [immich]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                regex: server
                action: keep
              - source_labels: [__meta_kubernetes_pod_ip]
                regex: (.+)
                replacement: $${1}:8082
                target_label: __address__
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
  processors:
    resource:
      attributes:
        - key: k8s.cluster.name
          value: homelab
          action: upsert
  exporters:
    debug: null
    otlp:
      endpoint: otel-gateway.observability.svc:4317
      tls:
        insecure: true
      sending_queue:
        enabled: true
        queue_size: 1000
  service:
    telemetry:
      resource:
        service.name: otel-agent
      # Telemetria do próprio coletor por OTLP (receiver local): alimenta o
      # dashboard e os alertas de exportação do coletor.
      metrics:
        level: normal
        readers:
          - periodic:
              exporter:
                otlp:
                  protocol: http/protobuf
                  endpoint: http://localhost:4318
    # Os presets acrescentam filelog, kubeletstats e k8sattributes aos pipelines.
    pipelines:
      logs:
        receivers: [otlp]
        processors: [memory_limiter, resource, batch]
        exporters: [otlp]
      metrics:
        receivers: [otlp, prometheus]
        processors: [memory_limiter, resource, batch]
        exporters: [otlp]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, resource, batch]
        exporters: [otlp]

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
