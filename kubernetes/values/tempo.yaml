# Values do chart tempo (grafana-community, binário único), versão em
# kubernetes/apps/values.yaml. Traces entram por OTLP do otel-gateway e ficam no
# disco do notebook. Veja docs/adr/008.
tempo:
  tag: 3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
  reportingEnabled: false
  # Só OTLP: o coletor converte o que vier em outros formatos.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  retention: 168h
  # Service graphs e span metrics (RED) a partir dos traces. É a única escrita
  # fora do OTLP: o Tempo só sabe enviar essas métricas por remote write.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://prometheus-server.observability.svc/api/v1/write
    storage:
      path: /var/tempo/generator/wal
  overrides:
    defaults:
      metrics_generator:
        processors: [service-graphs, span-metrics]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

persistence:
  enabled: true
  storageClassName: local-path
  size: 3Gi
