# Values do chart argo-cd, usados no helm install do bootstrap e no self-manage.
# O Ingress via Tailscale é adicionado em kubernetes/apps/templates/argocd.yaml.
configs:
  params:
    # TLS termina no proxy do Tailscale Operator
    server.insecure: true
    # Traces de sync/render/API por OTLP para o otel-agent (docs/adr/008).
    otlp.address: otel-agent.observability.svc:4317
    otlp.insecure: true
  cm:
    # Habilita o generator KSOPS (exec KRM function) nas Applications kustomize.
    kustomize.buildOptions: --enable-alpha-plugins --enable-exec
    # Health real das Applications filhas: sem isso as sync-waves do app-of-apps
    # não esperam (p. ex.) o operator do CNPG ficar Healthy antes do Cluster.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
  repositories:
    # Charts Helm via OCI (sem credenciais: repositório público).
    immich-charts:
      name: immich-charts
      type: helm
      url: ghcr.io/immich-app/immich-charts
      enableOCI: "true"
dex:
  enabled: false
notifications:
  enabled: false

# KSOPS: descriptografa *.sops.yaml no render, com a chave age do cluster
# (Secret argocd/sops-age, criado pelo Ansible antes do ArgoCD). Veja docs/adr/004-ksops.md.
repoServer:
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /sops-age/keys.txt
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1@sha256:4def9fdd4e2f850265740ebe9592c5455d19b76891e88e602df8b52d74b95334
      command: [/usr/local/bin/ksops, install, --with-kustomize, /custom-tools]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: custom-tools
          mountPath: /custom-tools
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age
  volumeMounts:
    # Só o ksops: o kustomize continua o que vem na imagem do ArgoCD.
    - name: custom-tools
      mountPath: /usr/local/bin/ksops
      subPath: ksops
    - name: sops-age
      mountPath: /sops-age
      readOnly: true
  metrics:
    enabled: true

# Services de métricas lidos pelo otel-agent (receiver prometheus), que os envia por
# OTLP ao Prometheus. argocd_app_info alimenta o alerta de Application fora de Healthy.
controller:
  metrics:
    enabled: true
server:
  metrics:
    enabled: true
