apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab-apps
  namespace: argocd
  annotations:
    # Antes das Applications que o usam (templates/external-apps.yaml).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Apps de outros repos (repotpl-k8s-app); só recursos namespaced
  sourceRepos:
    - https://github.com/bernats-homelab/*
    # Conta pessoal: só repos públicos (a credencial GitHub App cobre só a org).
    - https://github.com/Bemesko/*
  destinations:
    # Qualquer namespace, exceto os do sistema e da plataforma (negação do ArgoCD).
    - server: https://kubernetes.default.svc
      namespace: "*"
    {{- range list "argocd" "kube-system" "kube-public" "kube-node-lease" "default" "tailscale" "cnpg-system" "immich" "obsidian" "home-assistant" "backup" "hello-world" }}
    - server: https://kubernetes.default.svc
      namespace: "!{{ . }}"
    {{- end }}
  # Nada cluster-scoped (ClusterRole, CRD, webhook...), só o Namespace do CreateNamespace.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
