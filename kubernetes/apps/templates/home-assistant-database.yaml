apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant-database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    # Só o Postgres (CNPG) do recorder: fica Healthy sozinho, antes do HA (wave 3).
    path: kubernetes/workloads/home-assistant/database
  destination:
    server: https://kubernetes.default.svc
    namespace: home-assistant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
