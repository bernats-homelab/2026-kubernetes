# Traces (recebe OTLP do otel-gateway). Veja docs/adr/008.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: {{ .Values.charts.tempo.repoURL }}
      chart: {{ .Values.charts.tempo.chart }}
      targetRevision: {{ .Values.charts.tempo.version | quote }}
      helm:
        releaseName: tempo
        valueFiles:
          - $values/kubernetes/values/tempo.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
