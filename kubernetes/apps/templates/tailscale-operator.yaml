{{- if .Values.tailscaleOperator.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: {{ .Values.charts.tailscaleOperator.repoURL }}
      chart: {{ .Values.charts.tailscaleOperator.chart }}
      targetRevision: {{ .Values.charts.tailscaleOperator.version | quote }}
      helm:
        releaseName: tailscale-operator
        valueFiles:
          - $values/kubernetes/values/tailscale-operator.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
