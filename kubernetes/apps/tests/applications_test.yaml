suite: applications
templates:
  - templates/argocd.yaml
  - templates/tailscale-operator.yaml
  - templates/hello-world.yaml
  - templates/cloudnative-pg.yaml
  - templates/immich-database.yaml
  - templates/immich.yaml
  - templates/obsidian.yaml
tests:
  - it: toda Application tem sync automático com prune e selfHeal
    asserts:
      - isKind:
          of: Application
      - equal:
          path: spec.syncPolicy.automated.prune
          value: true
      - equal:
          path: spec.syncPolicy.automated.selfHeal
          value: true
      - equal:
          path: metadata.namespace
          value: argocd

  - it: sync-waves seguem a ordem operator -> argocd -> workloads
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"
        template: templates/tailscale-operator.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
        template: templates/argocd.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        template: templates/hello-world.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"
        template: templates/cloudnative-pg.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        template: templates/immich-database.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "3"
        template: templates/immich.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        template: templates/obsidian.yaml

  - it: Application do ArgoCD não tem finalizer (não se auto-apaga)
    template: templates/argocd.yaml
    asserts:
      - notExists:
          path: metadata.finalizers

  - it: versão do chart do ArgoCD vem do values (fonte única)
    template: templates/argocd.yaml
    set:
      charts.argocd.version: 9.9.9
    asserts:
      - equal:
          path: spec.sources[0].targetRevision
          value: 9.9.9
      - equal:
          path: spec.sources[0].chart
          value: argo-cd

  - it: repoURL e targetRevision propagam para as fontes do repo
    set:
      repoURL: https://github.com/example/fork
      targetRevision: abc123
    asserts:
      - equal:
          path: spec.source.repoURL
          value: https://github.com/example/fork
        template: templates/hello-world.yaml
      - equal:
          path: spec.source.targetRevision
          value: abc123
        template: templates/hello-world.yaml
      - equal:
          path: spec.sources[1].repoURL
          value: https://github.com/example/fork
        template: templates/argocd.yaml
      - equal:
          path: spec.sources[1].targetRevision
          value: abc123
        template: templates/argocd.yaml

  - it: com Tailscale ligado usa overlay tailscale e expõe o ArgoCD
    asserts:
      - hasDocuments:
          count: 1
        template: templates/tailscale-operator.yaml
      - equal:
          path: spec.source.path
          value: kubernetes/workloads/hello-world/overlays/tailscale
        template: templates/hello-world.yaml
      - equal:
          path: spec.sources[0].helm.valuesObject.server.ingress.ingressClassName
          value: tailscale
        template: templates/argocd.yaml

  - it: com Tailscale desligado (CI) remove operator e Ingress
    set:
      tailscaleOperator.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/tailscale-operator.yaml
      - equal:
          path: spec.source.path
          value: kubernetes/workloads/hello-world/base
        template: templates/hello-world.yaml
      - notExists:
          path: spec.sources[0].helm.valuesObject
        template: templates/argocd.yaml

  - it: Immich usa o chart OCI sem o prefixo oci:// (formato do ArgoCD)
    template: templates/immich.yaml
    asserts:
      - equal:
          path: spec.sources[0].repoURL
          value: ghcr.io/immich-app/immich-charts
      - equal:
          path: spec.sources[0].chart
          value: immich

  - it: versões dos charts do Immich e do CNPG vêm do values (fonte única)
    set:
      charts.immich.version: 9.9.9
      charts.cloudnativePg.version: 8.8.8
    asserts:
      - equal:
          path: spec.sources[0].targetRevision
          value: 9.9.9
        template: templates/immich.yaml
      - equal:
          path: spec.sources[0].targetRevision
          value: 8.8.8
        template: templates/cloudnative-pg.yaml

  - it: banco do Immich não depende do toggle de NAS (só o Postgres)
    template: templates/immich-database.yaml
    set:
      nasStorage.enabled: false
    asserts:
      - equal:
          path: spec.source.path
          value: kubernetes/workloads/immich/database

  - it: PVCs vão na Application do Immich (quem as monta), com NAS no overlay nas
    template: templates/immich.yaml
    asserts:
      - equal:
          path: spec.sources[2].path
          value: kubernetes/workloads/immich/storage/overlays/nas

  - it: sem NAS (CI) as PVCs do Immich usam base (local-path)
    template: templates/immich.yaml
    set:
      nasStorage.enabled: false
    asserts:
      - equal:
          path: spec.sources[2].path
          value: kubernetes/workloads/immich/storage/base

  - it: Immich exposto como "fotos" só com Tailscale
    template: templates/immich.yaml
    asserts:
      - equal:
          path: spec.sources[0].helm.valuesObject.server.ingress.main.className
          value: tailscale
      - equal:
          path: spec.sources[0].helm.valuesObject.server.ingress.main.hosts[0].host
          value: fotos

  - it: sem Tailscale (CI) o Immich não tem Ingress
    template: templates/immich.yaml
    set:
      tailscaleOperator.enabled: false
    asserts:
      - notExists:
          path: spec.sources[0].helm.valuesObject

  - it: Obsidian com Tailscale usa o overlay (Ingress borbsidian + basic auth) e o vault do NAS
    template: templates/obsidian.yaml
    asserts:
      - equal:
          path: spec.sources[0].path
          value: kubernetes/workloads/obsidian/overlays/tailscale
      - equal:
          path: spec.sources[1].path
          value: kubernetes/workloads/obsidian/storage/overlays/nas

  - it: sem Tailscale e sem NAS (CI) o Obsidian usa base nos dois
    template: templates/obsidian.yaml
    set:
      tailscaleOperator.enabled: false
      nasStorage.enabled: false
    asserts:
      - equal:
          path: spec.sources[0].path
          value: kubernetes/workloads/obsidian/base
      - equal:
          path: spec.sources[1].path
          value: kubernetes/workloads/obsidian/storage/base
