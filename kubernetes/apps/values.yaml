# Repositório e revisão que as Applications filhas sincronizam.
# A Application raiz (kubernetes/bootstrap/root-app.yaml.j2) sobrescreve estes valores.
repoURL: https://github.com/bernats-homelab/2026-kubernetes
targetRevision: main

tailscaleOperator:
  # false apenas no CI (sem tailnet): remove o operator e os Ingress do Tailscale.
  enabled: true

nasStorage:
  # true: PVCs do Immich vinculadas aos PVs NFS do NAS (criados pelo Ansible, role nas_storage).
  # false (CI): PVCs em local-path.
  enabled: true

# Apps de outros repos (org bernats-homelab ou conta pessoal Bemesko, esta só pública),
# criados a partir de bernats-homelab/repotpl-k8s-app. Cada entrada vira uma Application
# no AppProject homelab-apps que sincroniza deploy/ do repo na tag fixada aqui (como as
# versões dos charts). Nova versão = PR trocando targetRevision; o job de release do
# repo da app mostra o trecho pronto.
#   <nome>:                  # nome da Application e, por padrão, do namespace
#     repoURL: https://github.com/bernats-homelab/<repo>
#     targetRevision: vX.Y.Z
#     namespace: <ns>        # opcional
#     syncWave: "2"          # opcional
apps:
  # PWA de lista de compras (Nuxt 4) → https://grocery-ops.<sua-tailnet>
  grocery-ops:
    repoURL: https://github.com/Bemesko/grocery-ops
    targetRevision: v0.2.1

# O próprio template como app externa, ligado só no CI (Ansible external_apps_smoke_enabled):
# o e2e prova o caminho repo externo -> AppProject -> Application. Use uma tag publicada.
smokeApp:
  enabled: false
  repoURL: https://github.com/bernats-homelab/repotpl-k8s-app
  targetRevision: v0.1.0

# FONTE ÚNICA das versões de charts. O Ansible lê este arquivo para o helm install
# inicial do ArgoCD, então bootstrap e self-manage usam sempre a mesma versão.
charts:
  argocd:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    version: 10.11.6
  tailscaleOperator:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    version: 1.104.2
  cloudnativePg:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    version: 0.29.1
  immich:
    # Só OCI: o repo HTTP do immich-charts foi descontinuado.
    repoURL: oci://ghcr.io/immich-app/immich-charts
    chart: immich
    version: 0.13.4
  # Observabilidade (docs/adr/008). Os charts da Grafana migraram para grafana-community.
  prometheus:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    version: 29.45.0
  loki:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    version: 21.0.0
  tempo:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    version: 3.2.1
  grafana:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    version: 14.4.0
  # Um chart, duas releases: otel-agent (DaemonSet) e otel-gateway (Deployment).
  opentelemetryCollector:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    version: 0.178.2
