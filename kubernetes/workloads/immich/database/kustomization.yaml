# Banco do Immich: CloudNativePG + VectorChord, no disco do notebook (local-path).
# As PVCs do Immich ficam em ../storage, junto da Application que as monta.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
labels:
  - pairs:
      app.kubernetes.io/part-of: immich
resources:
  - database-cluster.yaml
  - database.yaml
