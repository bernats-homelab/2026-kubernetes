# Extensões exigidas pelo Immich, criadas pelo operator (superuser) no banco "app".
# Usuário/senha/URI ficam no Secret immich-database-app, gerado pelo CNPG.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich-database
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  name: app
  owner: app
  cluster:
    name: immich-database
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: present
    - name: earthdistance
      ensure: present
    - name: cube
      ensure: present
