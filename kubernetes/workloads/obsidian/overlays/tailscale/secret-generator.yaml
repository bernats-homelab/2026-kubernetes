# KSOPS: descriptografa os arquivos abaixo no render (repo-server do ArgoCD).
# Em validação offline (pre-commit/CI) scripts/ksops-stub.py faz o papel do ksops.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: obsidian-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  # CUSTOM_USER/PASSWORD: basic auth do Selkies (veja o README para ler a senha).
  - ./auth.sops.yaml
