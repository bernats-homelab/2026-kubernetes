# Provisionamento do Grafana (regras de alerta e dashboards) lido pelo sidecar do chart.
# base = CI; overlays/tailscale = notebook (segredos, e-mail e Service "otel" na tailnet).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
labels:
  - pairs:
      app.kubernetes.io/part-of: observability
resources:
  # Dashboards da comunidade (scripts/vendor-dashboards.sh) e os próprios.
  - dashboards
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_alert: "1"
configMapGenerator:
  - name: grafana-alert-rules
    files:
      - alerts/homelab.yaml
  - name: grafana-alert-rules-hosts
    files:
      - alerts/hosts.yaml
  - name: grafana-alert-rules-kubernetes
    files:
      - alerts/kubernetes.yaml
  - name: grafana-alert-rules-observability
    files:
      - alerts/observability.yaml
  - name: grafana-alert-rules-apps
    files:
      - alerts/apps.yaml
