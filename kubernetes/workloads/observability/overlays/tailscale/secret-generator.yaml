# KSOPS: descriptografa os arquivos abaixo no render (repo-server do ArgoCD).
# Em validação offline (pre-commit/CI) scripts/ksops-stub.py faz o papel do ksops.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: observability-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  # admin-user/admin-password do Grafana.
  - ./grafana-admin.sops.yaml
  # GF_SMTP_* (Gmail + senha de app) e ALERT_EMAIL_TO; veja o README.
  - ./grafana-smtp.sops.yaml
