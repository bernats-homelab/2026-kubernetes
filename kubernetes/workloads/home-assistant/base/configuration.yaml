# configuration.yaml do Home Assistant, versionado no Git (ConfigMap montado por
# subPath: editar pela UI não funciona, mude aqui e faça push). Integrações
# configuradas pela UI (Alexa Devices, Bluetooth...) ficam em /config/.storage.
default_config:

homeassistant:
  name: Casa
  time_zone: America/Sao_Paulo
  country: BR
  language: pt-BR
  unit_system: metric
  currency: BRL

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Sem bloco http: desde o 2026.8 o HA guarda essa config em /config/.storage/http e
# ignora o YAML; mudanças só valem depois de confirmadas na UI em até 5 min após o
# restart. O proxy do Tailscale (Ingress "casa") chega pela rede de pods, então em
# Settings > System > Network > HTTP server: "Trust X-Forwarded-For" ligado e
# "Trusted proxies" = 10.42.0.0/16 (passo a passo no README).

# Histórico no Postgres (CNPG); DB_URL vem do Secret home-assistant-database-app.
recorder:
  db_url: !env_var DB_URL
  purge_keep_days: 30
