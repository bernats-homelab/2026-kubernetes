# configuration.yaml do Home Assistant, versionado no Git (ConfigMap montado por
# subPath: editar pela UI não funciona, mude aqui e faça push). Integrações
# configuradas pela UI (Alexa Devices, Bluetooth...) ficam em /config/.storage.
default_config:

homeassistant:
  name: Casa
  time_zone: America/Sao_Paulo
  country: BR
  language: pt-BR
  unit_system: metric
  currency: BRL

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# O proxy do Tailscale (Ingress "casa") chega pela rede de pods do k3s; o IP muda a
# cada recriação do proxy, então a confiança vai para o CIDR inteiro.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.42.0.0/16

# Histórico no Postgres (CNPG); DB_URL vem do Secret home-assistant-database-app.
recorder:
  db_url: !env_var DB_URL
  purge_keep_days: 30
