# https://casa.<sua-tailnet>, com TLS automático do Tailscale. O proxy chega pela
# rede de pods (10.42.0.0/16), listada em http.trusted_proxies do configuration.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: home-assistant
      port:
        name: http
  tls:
    - hosts:
        - casa
